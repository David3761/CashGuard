name: cashguard
# LOCAL DEVELOPMENT. Every `${VAR:-default}` secret below is a DEV-ONLY default, so a fresh clone
# runs with no setup. Never deploy with them: the hosted overlay (deploy/docker-compose.prod.yml)
# makes each one required (`${VAR:?}`), so a missing value stops `docker compose up`.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cashguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cashguard}   # DEV-ONLY default
      POSTGRES_DB: cashguard   # our app tables (B2)
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}   # DEV-ONLY default
    ports:
      - "5434:5432"   # host 5432 is often taken by a local Postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      # first start only: also create the `keycloak` database (users, clients, roles)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashguard -d cashguard"]
      interval: 2s
      timeout: 3s
      retries: 20

  db-test:
    image: postgres:16
    environment:
      # spelled out (not the anchor): tests/unit/test_config.py checks TEST_DATABASE_URL against it
      POSTGRES_USER: cashguard
      # throwaway test DB (tmpfs, never hosted); CI uses the same credentials
      POSTGRES_PASSWORD: cashguard
      POSTGRES_DB: cashguard_test
    ports:
      # 5432/5433 are often taken by other local Postgres projects
      - "5435:5432"
    tmpfs:
      - /var/lib/postgresql/data
    # Throwaway data: trade durability for speed.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cashguard -d cashguard_test"]  # TCP: the socket answers during init (H-1)
      interval: 2s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.0
    # Users, clients and roles are stored in Postgres (`keycloak` database in `db`).
    # --import-realm seeds them from the realm file on the first start only; an existing realm is skipped.
    command: ["start-dev", "--import-realm"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}   # DEV-ONLY default
      KC_DEMO_PASSWORD: ${KC_DEMO_PASSWORD:-cashguard-dev}   # DEV-ONLY default (>= 12 chars)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}   # DEV-ONLY default
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}   # DEV-ONLY default
      # One public address for every token's `iss` (D36); hosted: https://auth.<domain>
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8081}
      # ...but token/JWKS calls from inside the network (api, cron) use http://keycloak:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_CRON_CLIENT_SECRET: ${KC_CRON_CLIENT_SECRET:-dev-cron-secret}   # DEV-ONLY default
    ports:
      - "8081:8080"   # host 8081: 8080 is often taken (pgadmin, other Keycloaks); must match KC_HOSTNAME
    volumes:
      - ./keycloak/realm-cashguard.json:/opt/keycloak/data/import/realm-cashguard.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    build: .
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://cashguard:${POSTGRES_PASSWORD:-cashguard}@db:5432/cashguard   # DEV-ONLY default
      KEYCLOAK_ISSUER: ${KC_HOSTNAME:-http://localhost:8081}/realms/cashguard
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/cashguard
      # Swagger at /api/docs for local work; the hosted overlay turns it off.
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      # Proxies whose X-Forwarded-* uvicorn trusts (--proxy-headers). Locally none: port 8000
      # is reached directly, so a client can't spoof its address. The hosted overlay sets Caddy.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    # Migrate the DB, then serve. One worker: the WebSocket manager and the rate limits live in
    # memory (arch 5.2). This overrides the Dockerfile CMD: keep the two in step.
    # `$$` is a literal `$` for the container's shell (compose would interpolate a single `$`).
    command:
      - sh
      - -c
      - >-
        alembic upgrade head && exec uvicorn app.main:create_app --factory
        --host 0.0.0.0 --port 8000 --workers 1
        --proxy-headers --forwarded-allow-ips "$${FORWARDED_ALLOW_IPS:-127.0.0.1}"
        --no-server-header --ws-max-size 65536
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  cron:
    build: ./cron
    security_opt:
      - no-new-privileges:true
    environment:
      API_URL: http://api:8000/api
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/cashguard/protocol/openid-connect/token
      CRON_CLIENT_SECRET: ${KC_CRON_CLIENT_SECRET:-dev-cron-secret}   # DEV-ONLY default
      # "all", or a space-separated list (demo: "process recover"; the simulator drives the day jobs, Q21)
      CRON_ENABLED_JOBS: ${CRON_ENABLED_JOBS:-all}
      TZ: Europe/Bucharest
    depends_on:
      - api
      - keycloak

volumes:
  db-data:
