# Minimal compose: only the test database, so `make db-up` works.
# bomboe's B1 compose (db, keycloak, api, cron) replaces this file; see HANDOFFS.md H-1.
services:
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: cashguard_test
      POSTGRES_PASSWORD: cashguard_test
      POSTGRES_DB: cashguard_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # Over TCP: the entrypoint's temporary init server only listens on the Unix socket, so a
      # socket check would report healthy before port 5433 accepts connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cashguard_test -d cashguard_test"]
      interval: 2s
      timeout: 3s
      retries: 15
