version: 2
updates:
  # Backend: Python dependencies locked with uv (backend/pyproject.toml + backend/uv.lock).
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "[DEPS]"

  # Mobile: Flutter/Dart packages (mobile/pubspec.yaml + mobile/pubspec.lock).
  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dart-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "[DEPS]"

  # The SHA-pinned actions in .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "[DEPS]"
