# pre-commit hooks (https://pre-commit.com). Set up once from the repo root:
#   uvx pre-commit install
# Run on everything: uvx pre-commit run --all-files
# These are fast local checks; `cd backend && make check` (ruff, mypy, pytest) is still the gate.

# Generated files and lockfiles are left as their tools write them.
exclude: |
  (?x)^(
    .*\.g\.dart|
    .*\.chopper\.dart|
    mobile/lib/l10n/app_localizations.*\.dart|
    .*\.lock
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  # Same ruff version as backend/uv.lock; the config is read from backend/pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        files: ^backend/
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        files: ^backend/
        types_or: [python, pyi]

  # Secret scan of the staged changes, with .gitleaks.toml.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
